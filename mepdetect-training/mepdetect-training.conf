# /etc/nginx/conf.d/mepdetect-training.conf
# MEPdetect Training Platform Configuration

# ===== Upstream (Training container on localhost:8092) =====
upstream mepdetect_training {
    server 127.0.0.1:8092;
}

# ============================================================
#  HTTP (80): Allow ACME challenge + redirect to HTTPS
# ============================================================

server {
    listen 80;
    server_name train.mepdetect.com;

    # ACME challenge for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  HTTPS (443): Reverse proxy to Training API
# ============================================================

server {
    listen 443 ssl http2;
    server_name train.mepdetect.com;

    # SSL certificates
    ssl_certificate     /etc/letsencrypt/live/mepdetect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mepdetect.com/privkey.pem;

    # Large file uploads for datasets
    client_max_body_size 500m;  # Larger for dataset uploads
    client_body_timeout 600s;
    client_header_timeout 600s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # CORS headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Content-Length 0;
        return 204;
    }

    # Proxy to training container
    location / {
        proxy_pass http://mepdetect_training;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Very long timeouts for training jobs
        proxy_connect_timeout 600s;
        proxy_send_timeout 3600s;  # 1 hour
        proxy_read_timeout 3600s;  # 1 hour
        
        # Buffering settings for large uploads
        proxy_request_buffering off;
        proxy_buffering off;
        
        # WebSocket support (for potential real-time updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://mepdetect_training/health;
        access_log off;
    }
}
