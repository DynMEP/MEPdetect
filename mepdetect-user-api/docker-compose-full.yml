# Legacy all-in-one stack (prefer root ../docker-compose.yml + ./dcompose).
# Requires .env with POSTGRES_PASSWORD, SECRET_KEY, etc. Run from this directory.

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mepdetect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mepdetect}
      POSTGRES_USER: ${POSTGRES_USER:-mepdetect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mepdetect-network
    deploy:
      resources:
        limits:
          cpus: '0.7'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mepdetect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mepdetect-redis
    restart: unless-stopped
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --appendonly yes
    networks:
      - mepdetect-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Management API (Port 8093)
  user-api:
    build:
      context: ../mepdetect-user-api
      dockerfile: Dockerfile
    container_name: mepdetect-user-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "8093:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mepdetect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mepdetect}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
      - RECAPTCHA_ENABLED=${RECAPTCHA_ENABLED:-true}
    networks:
      - mepdetect-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Detection API (Port 8091)
  detection-api:
    build:
      context: ../mepdetect-backend
      dockerfile: Dockerfile
    container_name: mepdetect-detection-api
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8091:8000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/results:/app/results
      - /opt/mepdetect-shared/models:/app/models
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mepdetect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mepdetect}
      - JWT_SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - API_TITLE=MEPdetect Detection API
      - API_VERSION=1.0.0
      - LOG_LEVEL=info
      - DEFAULT_CONFIDENCE=0.25
      - DEFAULT_DPI=400
      - MAX_UPLOAD_SIZE=50MB
    networks:
      - mepdetect-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Training API (Port 8092)
  training-api:
    build:
      context: ../mepdetect-training
      dockerfile: Dockerfile
    container_name: mepdetect-training-api
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8092:8000"
    volumes:
      - ./data/datasets:/app/datasets
      - /opt/mepdetect-shared/models:/app/models
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mepdetect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mepdetect}
      - API_TITLE=MEPdetect Training API
      - API_VERSION=1.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - mepdetect-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Landing Page (Port 8090)
  landing-page:
    build:
      context: ../mepdetect-frontend
      dockerfile: Dockerfile
    container_name: mepdetect-landing
    restart: unless-stopped
    ports:
      - "8090:80"
    networks:
      - mepdetect-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: mepdetect-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - landing-page
      - user-api
      - detection-api
      - training-api
    networks:
      - mepdetect-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mepdetect-network:
    driver: bridge

volumes:
  postgres-data:
  uploads:
  results:
  models:
  datasets: