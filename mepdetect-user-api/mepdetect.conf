# /etc/nginx/conf.d/mepdetect.conf
# MEPdetect landing page + User API reverse proxy (+ auth subdomain)

# ===== Upstream (Landing container on localhost:8090) =====
upstream mepdetect_landing {
    server 127.0.0.1:8090;
}

# ===== Upstream (User API on localhost:8093) =====
upstream mepdetect_user_api {
    server 127.0.0.1:8093;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ============================================================
#  HTTP (80): Allow ACME challenge + redirect to HTTPS
#  (Includes auth.mepdetect.com)
# ============================================================
server {
    listen 80;
    server_name mepdetect.com www.mepdetect.com auth.mepdetect.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  HTTPS (443): Main site (mepdetect.com) - Landing + API routes
# ============================================================
server {
    listen 443 ssl http2;
    server_name mepdetect.com;

    ssl_certificate     /etc/letsencrypt/live/mepdetect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mepdetect.com/privkey.pem;

    client_max_body_size 50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # -----------------------------
    # User API (FastAPI) - NO rewrite
    # -----------------------------
    location /auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        #proxy_pass http://mepdetect_user_api/auth/;
        proxy_pass http://mepdetect_user_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user/ {
        proxy_pass http://mepdetect_user_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /subscriptions/ {
        proxy_pass http://mepdetect_user_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://mepdetect_user_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------
    # Landing page (default)
    # -----------------------------
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://mepdetect_landing;
        #proxy_pass http://mepdetect_detection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Landing health (optional)
    location /health {
        proxy_pass http://mepdetect_landing/health;
        access_log off;
    }
}

# ============================================================
#  HTTPS (443): auth.mepdetect.com -> User API
#  NOTE: Your certificate must include auth.mepdetect.com (SAN)
# ============================================================
server {
    listen 443 ssl http2;
    server_name auth.mepdetect.com;

    # Use a cert that includes auth.mepdetect.com
    ssl_certificate     /etc/letsencrypt/live/mepdetect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mepdetect.com/privkey.pem;

    client_max_body_size 50m;

    location = / {
        return 302 /docs;
    }

    location / {
        proxy_pass http://mepdetect_user_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================================
#  www -> non-www redirect
# ============================================================
server {
    listen 443 ssl http2;
    server_name www.mepdetect.com;

    ssl_certificate     /etc/letsencrypt/live/mepdetect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mepdetect.com/privkey.pem;

    return 301 https://mepdetect.com$request_uri;
}
