<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MEPdetect</title>
    
    <!-- Google reCAPTCHA v3 -->
    <script src="https://www.google.com/recaptcha/api.js?render=YOUR_RECAPTCHA_SITE_KEY"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container { display: flex; max-width: 1000px; width: 90%; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        
        .left-panel {
            flex: 1;
            padding: 60px;
            background: linear-gradient(135deg, #00d4ff 0%, #00a8cc 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .left-panel h1 { font-size: 36px; margin-bottom: 20px; }
        .left-panel p { font-size: 18px; opacity: 0.9; line-height: 1.6; }
        
        .right-panel { flex: 1; padding: 60px; }
        
        .tabs { display: flex; margin-bottom: 30px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: 500; border-bottom: 2px solid #e5e7eb; transition: 0.3s; }
        .tab.active { border-bottom-color: #00d4ff; color: #00d4ff; }
        
        .form { display: none; }
        .form.active { display: block; }
        
        .form-group { margin-bottom: 20px; }
        .label { display: block; font-size: 14px; font-weight: 500; color: #4b5563; margin-bottom: 8px; }
        .input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }
        .input:focus { outline: none; border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: #00d4ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background: #00b8e6; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,212,255,0.3); }
        
        .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        
        .divider { text-align: center; margin: 20px 0; color: #9ca3af; }
        .link { color: #00d4ff; text-decoration: none; font-weight: 500; }
        .link:hover { text-decoration: underline; }
        
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .left-panel { padding: 40px 30px; }
            .right-panel { padding: 40px 30px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>MEPdetect</h1>
            <p>AI-powered symbol detection for electrical, HVAC, and plumbing technical drawings.</p>
            <p style="margin-top: 20px; font-size: 16px;">Automate the counting. Keep the judgement.</p>
        </div>
        
        <div class="right-panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Login</div>
                <div class="tab" onclick="switchTab('register')">Register</div>
            </div>
            
            <div class="error" id="error"></div>
            <div class="success" id="success"></div>
            
            <!-- Login Form -->
            <form class="form active" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="label">Email</label>
                    <input type="email" class="input" name="email" required>
                </div>
                
                <div class="form-group">
                    <label class="label">Password</label>
                    <input type="password" class="input" name="password" required>
                </div>
                
                <button type="submit" class="btn">Sign In</button>
                
                <div class="divider">
                    <a href="#" class="link" onclick="alert('Contact support@mepdetect.com')">Forgot password?</a>
                </div>
            </form>
            
            <!-- Register Form -->
            <form class="form" id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="label">Full Name</label>
                    <input type="text" class="input" name="full_name" required>
                </div>
                
                <div class="form-group">
                    <label class="label">Email</label>
                    <input type="email" class="input" name="email" required>
                </div>
                
                <div class="form-group">
                    <label class="label">Company (optional)</label>
                    <input type="text" class="input" name="company">
                </div>
                
                <div class="form-group">
                    <label class="label">Password</label>
                    <input type="password" class="input" name="password" required minlength="8">
                </div>
                
                <button type="submit" class="btn">Create Account</button>
                
                <div class="divider" style="font-size: 12px; color: #6b7280;">
                    By signing up, you agree to our Terms of Service and Privacy Policy
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8093';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
            
            hideMessages();
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideMessages();
            
            const formData = new FormData(e.target);
            
            try {
                // Get reCAPTCHA token
                const recaptchaToken = await grecaptcha.execute('YOUR_RECAPTCHA_SITE_KEY', {action: 'login'});
                
                const data = {
                    email: formData.get('email'),
                    password: formData.get('password'),
                    recaptcha_token: recaptchaToken
                };
                
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    showError(error.detail || 'Login failed');
                    return;
                }
                
                const result = await response.json();
                localStorage.setItem('authToken', result.access_token);
                
                // Redirect to dashboard
                window.location.href = '/dashboard.html';
                
            } catch (error) {
                showError('Network error. Please try again.');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideMessages();
            
            const formData = new FormData(e.target);
            
            try {
                // Get reCAPTCHA token
                const recaptchaToken = await grecaptcha.execute('YOUR_RECAPTCHA_SITE_KEY', {action: 'register'});
                
                const data = {
                    email: formData.get('email'),
                    password: formData.get('password'),
                    full_name: formData.get('full_name'),
                    company: formData.get('company') || null,
                    recaptcha_token: recaptchaToken
                };
                
                const response = await fetch(API_BASE + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    showError(error.detail || 'Registration failed');
                    return;
                }
                
                const result = await response.json();
                localStorage.setItem('authToken', result.access_token);
                
                showSuccess('Account created successfully! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
                
            } catch (error) {
                showError('Network error. Please try again.');
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success');
            successEl.textContent = message;
            successEl.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }

        // Check if already logged in
        if (localStorage.getItem('authToken')) {
            window.location.href = '/dashboard.html';
        }
    </script>
</body>
</html>
