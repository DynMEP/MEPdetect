# /etc/nginx/conf.d/mepdetect-api.conf
# MEPdetect Backend API Configuration

# ===== Upstream (Backend container on localhost:8091) =====
upstream mepdetect_backend {
    server 127.0.0.1:8091;
}

# ============================================================
#  HTTP (80): Allow ACME challenge + redirect to HTTPS
# ============================================================

server {
    listen 80;
    server_name api.mepdetect.com;

    # ACME challenge for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  HTTPS (443): Reverse proxy to Backend API
# ============================================================

server {
    listen 443 ssl http2;
    server_name api.mepdetect.com;

    # SSL certificates
    ssl_certificate     /etc/letsencrypt/live/mepdetect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mepdetect.com/privkey.pem;

    # Large file uploads for drawings
    client_max_body_size 50m;
    client_body_timeout 300s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # CORS headers (already in FastAPI, but adding here as backup)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    
    # Handle preflight requests
    add_header Access-Control-Max-Age 1728000 always;
    
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Proxy to backend container
    location / {
        proxy_pass http://mepdetect_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Timeouts for long-running detections
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering settings for file uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Health check endpoint (optional logging)
    location /health {
        proxy_pass http://mepdetect_backend/health;
        access_log off;
    }
}
