# /etc/nginx/conf.d/mepdetect.conf
# MEPdetect landing page configuration
# Integrates with your existing wady.io/giftcard setup

# ===== Upstream (MEPdetect container on localhost:8090) =====
upstream mepdetect_landing {
    server 127.0.0.1:8090;
}

# ============================================================
#  HTTP (80): Allow ACME challenge + redirect to HTTPS
# ============================================================

server {
    listen 80;
    server_name mepdetect.com www.mepdetect.com;

    # ACME challenge for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  HTTPS (443): Reverse proxy to MEPdetect container
# ============================================================

# Main domain
server {
    listen 443 ssl http2;
    server_name mepdetect.com;

    # SSL certificates (get via Certbot - see instructions below)
    ssl_certificate     /etc/letsencrypt/live/mepdetect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mepdetect.com/privkey.pem;

    # Include Certbot SSL options if they exist
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy to MEPdetect container
    location / {
        proxy_pass http://mepdetect_landing;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (optional - keep internal)
    location /health {
        proxy_pass http://mepdetect_landing/health;
        access_log off;
    }
}

# www subdomain (redirect to non-www)
server {
    listen 443 ssl http2;
    server_name www.mepdetect.com;

    ssl_certificate     /etc/letsencrypt/live/mepdetect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mepdetect.com/privkey.pem;

    # Redirect www to non-www
    return 301 https://mepdetect.com$request_uri;
}
