# MEPdetect Landing Page - Nginx Configuration
# Fixed to properly serve static HTML files

server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/mepdetect_access.log;
    error_log /var/log/nginx/mepdetect_error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Health check endpoint (must be before other locations)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Extensionless app routes (e.g. /login -> login.html)
    location ~ ^/(login|dashboard|admin|pricing|checkout|verify-email|privacy|terms)/?$ {
        try_files /$1.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Serve static HTML files directly - NO fallback to index.html
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Root path - serve index.html
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # All other paths - try file, then directory, then 404
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 404 =404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 500 502 503 504 /index.html;
    location = /index.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}